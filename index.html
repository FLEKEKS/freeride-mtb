<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101b27"><meta name="description" content="Freeride MTB — гірський велофрірайд">
<link rel="manifest" href="manifest.json"><title>Freeride MTB — Downhill</title>
<style>
:root{color-scheme:dark;--glass:#101d2bdc;--line:#ffffff65;--orange:#ffb52e}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101b27;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;touch-action:none;overscroll-behavior:none}#app{position:fixed;inset:0;overflow:hidden;background:#8cc9e8}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}button{font:800 clamp(17px,2.7vw,24px)/1 system-ui;color:#fff;background:linear-gradient(145deg,#314b60,#101c29);border:2px solid #ffffffa8;border-radius:17px;min-width:56px;min-height:56px;padding:10px 15px;box-shadow:0 5px 15px #07111b55;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}button:active,button.pressed{background:linear-gradient(145deg,#f5a62a,#bd5b24);transform:translateY(1px)}#hud{position:absolute;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));padding:10px 14px;background:var(--glass);border:1px solid var(--line);border-radius:15px;min-width:158px;box-shadow:0 8px 22px #10203033;pointer-events:none;font-weight:850;text-shadow:0 1px 3px #0008}#hud .brand{font-size:12px;letter-spacing:1.5px;color:#b9d7e8}#stats{font-size:clamp(17px,2.4vw,22px);margin:2px 0}#boostbar{height:7px;border-radius:8px;background:#ffffff35;overflow:hidden;margin-top:6px}#boostfill{height:100%;width:100%;background:linear-gradient(90deg,#f6a52c,#ffe18a);border-radius:8px}#top{position:absolute;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;gap:8px}#top button{width:58px;height:58px;padding:0;font-size:25px}#hint{position:absolute;top:13%;left:50%;transform:translateX(-50%);font-size:clamp(12px,2vw,18px);font-weight:850;text-align:center;white-space:nowrap;text-shadow:0 2px 6px #19344e;pointer-events:none}#controls{position:absolute;inset:0;pointer-events:none}.cluster{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:9px;pointer-events:auto}.cluster button{width:clamp(55px,8vw,76px);height:clamp(55px,8vw,76px);font-size:clamp(22px,3.5vw,30px);border-radius:19px}#steer{left:max(12px,env(safe-area-inset-left))}#drive{right:max(12px,env(safe-area-inset-right))}#boost{position:absolute;bottom:max(15px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);min-width:clamp(115px,17vw,165px);height:clamp(58px,8vw,76px);border:3px solid var(--orange);font-size:clamp(20px,3vw,29px);pointer-events:auto}#boost.pressed{transform:translateX(-50%) translateY(1px)}#overlay{display:none;position:absolute;inset:0;background:#081522c9;backdrop-filter:blur(5px);align-items:center;justify-content:center;padding:22px;text-align:center}#panel{width:min(420px,94vw);padding:26px 22px;border-radius:22px;background:linear-gradient(145deg,#263e52,#101c29);border:1px solid #ffffff55;box-shadow:0 20px 70px #0008}#panel h1{font-size:clamp(25px,5vw,38px);margin:0 0 8px}#panel p{color:#d3e2ec;line-height:1.45;margin:0 0 20px}#panel button{min-width:175px;border-color:var(--orange)}#toast{position:absolute;left:50%;top:25%;transform:translate(-50%,-10px);opacity:0;background:#102235e8;border:1px solid #ffffff55;border-radius:30px;padding:9px 17px;font-weight:900;pointer-events:none;transition:.2s}#toast.show{opacity:1;transform:translate(-50%,0)}@media(orientation:portrait){#hint{top:20%;white-space:normal;width:90%}#boost{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 2px)}#steer{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 5px)}#drive{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 5px)}}
</style></head>
<body><main id="app"><canvas id="game" aria-label="Гра Freeride MTB"></canvas>
<div id="hud"><div class="brand">FREERIDE MTB / DOWNHILL</div><div id="stats">0 м · 0 очок</div><div id="speed">0 км/год</div><div id="boostbar"><div id="boostfill"></div></div></div>
<div id="hint">↑ ПЕДАЛІ · ↓ ГАЛЬМО · ← / → БАЛАНС · BOOST</div>
<div id="top"><button id="pause" aria-label="Пауза">Ⅱ</button><button id="fullscreen" aria-label="Повний екран">⛶</button><button id="restart" aria-label="Перезапуск">↻</button></div>
<div id="controls"><div id="steer" class="cluster"><button data-key="left">←</button><button data-key="right">→</button></div><button id="boost" data-key="boost">BOOST</button><div id="drive" class="cluster"><button data-key="brake">↓</button><button data-key="pedal">↑</button></div></div>
<div id="toast"></div><div id="overlay"><section id="panel"><h1 id="overTitle">ПАУЗА</h1><p id="overText">Гра призупинена</p><button id="overButton">ПРОДОВЖИТИ</button></section></div>
</main>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),c=canvas.getContext('2d',{alpha:false});const $=id=>document.getElementById(id);
const input={left:false,right:false,pedal:false,brake:false,boost:false};let vw=innerWidth,vh=innerHeight,dpr=1,last=0,cam=0,meters=0,points=0,paused=false,dead=false,airTime=0,toastTimer=0,particles=[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
let bike;
function terrain(x){const n=Math.floor(x/720),local=x-n*720;let y=vh*.69+Math.sin(x*.0018)*vh*.055+Math.sin(x*.0043)*vh*.018+Math.sin(x*.00057)*vh*.045+Math.sin(x*.012)*vh*.006;
// Repeatable, shaped dirt jumps and drops in the riding line.
const ramps=[{x:210,h:75,w:145},{x:530,h:115,w:175},{x:900,h:62,w:130},{x:1210,h:145,w:205},{x:1580,h:88,w:155}];
for(const r of ramps){const dx=x-(n*1800+r.x);if(Math.abs(dx)<r.w){const t=dx/r.w;y-=r.h*Math.pow(Math.max(0,1-Math.abs(t)),1.45);}}
return y;}
function slope(x){return (terrain(x+3)-terrain(x-3))/6}
function initBike(){const x=cam+vw*.32,y=terrain(x);bike={x:vw*.32,y:y-40,vx:205,vy:0,angle:Math.atan(slope(x)),spin:0,frontTravel:0,rearTravel:0,frontVel:0,rearVel:0,grounded:true,boost:100,rotations:0};}
function resize(){dpr=Math.min(devicePixelRatio||1,2);vw=innerWidth;vh=innerHeight;canvas.width=Math.round(vw*dpr);canvas.height=Math.round(vh*dpr);canvas.style.width=vw+'px';canvas.style.height=vh+'px';c.setTransform(dpr,0,0,dpr,0,0);if(!bike)initBike()}
function popup(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1200)}
function overlay(title,msg,button){$('overTitle').textContent=title;$('overText').textContent=msg;$('overButton').textContent=button;$('overlay').style.display='flex'}function hideOverlay(){$('overlay').style.display='none'}
function reset(){cam=0;meters=0;points=0;paused=false;dead=false;airTime=0;particles=[];initBike();$('pause').textContent='Ⅱ';hideOverlay()}
function togglePause(){if(dead){reset();return}paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ';if(paused)overlay('ПАУЗА','Перепочинь. Траса нікуди не втече.','ПРОДОВЖИТИ');else hideOverlay()}
$('pause').addEventListener('click',togglePause);$('overButton').addEventListener('click',()=>{if(dead)reset();else{paused=false;$('pause').textContent='Ⅱ';hideOverlay()}});$('restart').addEventListener('click',reset);
$('fullscreen').addEventListener('click',async()=>{try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen();}else await document.exitFullscreen()}catch(e){popup('Повний екран недоступний у цьому браузері')}});
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const down=e=>{e.preventDefault();input[k]=true;b.classList.add('pressed');try{b.setPointerCapture(e.pointerId)}catch(_){}};const up=e=>{if(e)e.preventDefault();input[k]=false;b.classList.remove('pressed')};b.addEventListener('pointerdown',down);['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,up));});
const keymap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'pedal',KeyW:'pedal',ArrowDown:'brake',KeyS:'brake',Space:'boost'};addEventListener('keydown',e=>{if(keymap[e.code]){e.preventDefault();input[keymap[e.code]]=true}if(e.code==='KeyR')reset();if(e.code==='Escape'&&document.fullscreenElement)document.exitFullscreen()});addEventListener('keyup',e=>{if(keymap[e.code])input[keymap[e.code]]=false});addEventListener('blur',()=>Object.keys(input).forEach(k=>input[k]=false));
function spring(x,y,vy,dt){const rest=12,force=(rest-y)*95-vy*13;return {y:y+(vy+force*dt)*dt,vy:vy+force*dt}}
function emitDust(x,y,count=2){for(let i=0;i<count;i++)particles.push({x,y,vx:-30-Math.random()*95,vy:-15-Math.random()*65,life:.35+Math.random()*.35,size:2+Math.random()*4})}
function crash(){dead=true;overlay('ЗАБАГАТО ЕКСТРИМУ','Невдале приземлення. Спробуй м’якше вирівняти велосипед у повітрі.','ЩЕ РАЗ')}
function update(dt){if(paused||dead)return;const oldX=cam+vw*.32,groundY=terrain(oldX);const wasGrounded=bike.grounded;
let accel=input.pedal?310: -10;if(input.brake)accel-=520;if(input.boost&&bike.boost>0){accel+=470;bike.boost=Math.max(0,bike.boost-37*dt)}else bike.boost=Math.min(100,bike.boost+12*dt);bike.vx=clamp(bike.vx+accel*dt,75,690);
const speedFactor=bike.vx/250;cam+=bike.vx*dt;meters=cam/10;bike.x=vw*.32;
const worldX=cam+vw*.32,base=terrain(worldX),groundSlope=Math.atan(slope(worldX));
if(wasGrounded){const next=terrain(worldX);bike.y=next-42;bike.vy=0;bike.angle=lerp(bike.angle,groundSlope,Math.min(1,dt*8));bike.spin=0;bike.frontTravel=lerp(bike.frontTravel,clamp((groundY-next)*.18,0,9),dt*10);bike.rearTravel=lerp(bike.rearTravel,bike.frontTravel*.7,dt*8);
// Take-off from a rising lip; speed and ramp gradient determine lift.
const lip=slope(worldX)-slope(worldX-12);if(lip>.16&&bike.vx>145){bike.grounded=false;bike.vy=-Math.min(390,110+lip*520+speedFactor*35);airTime=0;popup('СТРИБОК!')}}
else{airTime+=dt;bike.vy+=790*dt;bike.y+=bike.vy*dt;const torque=(input.right?1:0)-(input.left?1:0);bike.spin+=torque*3.1*dt;bike.angle+=bike.spin*dt;bike.frontTravel=lerp(bike.frontTravel,0,dt*4);bike.rearTravel=lerp(bike.rearTravel,0,dt*4);
const landing=base-42;if(bike.y>=landing&&bike.vy>0){const angleError=Math.abs(Math.atan2(Math.sin(bike.angle-groundSlope),Math.cos(bike.angle-groundSlope)));if(angleError>1.18||Math.abs(bike.spin)>2.8){crash();return}bike.y=landing;bike.vy=0;bike.grounded=true;bike.angle=groundSlope;bike.spin=0;const trick=Math.floor(Math.abs(bike.angle)/(Math.PI*2));points+=Math.max(20,Math.floor(airTime*70))+trick*150;if(airTime>.35)popup('М’ЯКЕ ПРИЗЕМЛЕННЯ +'+(Math.floor(airTime*70)+20));airTime=0;emitDust(vw*.32,landing+38,12)}}
if(bike.grounded&&Math.random()<.24)emitDust(vw*.32-28,bike.y+35,1);
for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=150*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);
points+=Math.floor(bike.vx*dt*.025);$('stats').textContent=Math.floor(meters)+' м · '+points+' очок';$('speed').textContent=Math.round(bike.vx*.18)+' км/год';$('boostfill').style.width=bike.boost+'%';}
function path(points){c.beginPath();points.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));}
function drawBackground(){const sky=c.createLinearGradient(0,0,0,vh);sky.addColorStop(0,'#398bc4');sky.addColorStop(.55,'#a6d7ed');sky.addColorStop(1,'#e2efd9');c.fillStyle=sky;c.fillRect(0,0,vw,vh);
// Sun and distant mountain silhouettes.
c.fillStyle='#fff2c9';c.globalAlpha=.7;c.beginPath();c.arc(vw*.78,vh*.2,Math.min(vw,vh)*.055,0,Math.PI*2);c.fill();c.globalAlpha=1;
for(let layer=0;layer<3;layer++){const pts=[];for(let x=-10;x<=vw+10;x+=8){const wx=cam*.18+x*.65;pts.push([x,vh*(.43+layer*.085)+Math.sin(wx*(.0011+layer*.0003))*vh*.07+Math.sin(wx*.003)*vh*.025])}path(pts);c.lineTo(vw+10,vh);c.lineTo(-10,vh);c.closePath();c.fillStyle=['#b4cbd0','#76998b','#52785b'][layer];c.fill();}}
function drawTrees(){for(let i=-1;i<Math.ceil(vw/150)+2;i++){const wx=Math.floor((cam*.62+i*150)/150)*150;const x=wx-cam*.62;const y=terrain(wx+cam*.38)-30;const h=55+((Math.abs(Math.sin(wx*3.17))*50)|0);c.fillStyle='#594b3a';c.fillRect(x-4,y-h*.4,8,h*.55);c.fillStyle=['#245a45','#2f704c','#397b51'][(Math.abs(wx/150)|0)%3];c.beginPath();c.moveTo(x,y-h);c.lineTo(x-h*.45,y-h*.25);c.lineTo(x+h*.45,y-h*.25);c.closePath();c.fill();c.beginPath();c.moveTo(x,y-h*.72);c.lineTo(x-h*.52,y-h*.05);c.lineTo(x+h*.52,y-h*.05);c.closePath();c.fill();}}
function drawTerrain(){const pts=[];for(let x=-8;x<=vw+8;x+=4)pts.push([x,terrain(cam+vw*.32+x-vw*.32)]);path(pts);c.lineTo(vw+8,vh+8);c.lineTo(-8,vh+8);c.closePath();const dirt=c.createLinearGradient(0,vh*.55,0,vh);dirt.addColorStop(0,'#a66e43');dirt.addColorStop(.18,'#765037');dirt.addColorStop(1,'#493526');c.fillStyle=dirt;c.fill();path(pts);c.strokeStyle='#69a94e';c.lineWidth=8;c.lineJoin='round';c.stroke();path(pts.map(([x,y])=>[x,y-5]));c.strokeStyle='#b1d36c';c.lineWidth=2;c.stroke();
// Pebbles and small track-side details.
for(let i=0;i<22;i++){const x=((i*137-cam*.9)%(vw+100)+vw+100)%(vw+100)-30,y=terrain(cam+x)-10;c.fillStyle=i%2?'#c49a70':'#5a4939';c.beginPath();c.ellipse(x,y,3+i%3,1.8,0,0,Math.PI*2);c.fill();}}
function line(x1,y1,x2,y2,color,width){c.strokeStyle=color;c.lineWidth=width;c.lineCap='round';c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke()}
function wheel(x,y,r){c.fillStyle='#101b23';c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();c.strokeStyle='#d6e1e6';c.lineWidth=2;c.beginPath();c.arc(x,y,r-4,0,Math.PI*2);c.stroke();c.strokeStyle='#8fa5af';c.lineWidth=1;for(let i=0;i<8;i++){const a=i*Math.PI/4;line(x+Math.cos(a)*4,y+Math.sin(a)*4,x+Math.cos(a)*(r-4),y+Math.sin(a)*(r-4),'#a8bac1',.8)}c.fillStyle='#e4edf0';c.beginPath();c.arc(x,y,3,0,Math.PI*2);c.fill()}
function drawBike(){const x=vw*.32,y=bike.y+38;c.save();c.translate(x,y);c.rotate(bike.angle);const rear=[-35,0],front=[38,0],seat=[-14,-27],head=[20,-29],crank=[-2,-2];
// Frame and suspension with visible fork/shock.
wheel(rear[0],rear[1],19);wheel(front[0],front[1],19);
line(rear[0],rear[1],seat[0],seat[1],'#f04e3e',6);line(seat[0],seat[1],crank[0],crank[1],'#f04e3e',6);line(crank[0],crank[1],rear[0],rear[1],'#f04e3e',5);line(crank[0],crank[1],head[0],head[1],'#f04e3e',6);line(head[0],head[1],seat[0],seat[1],'#f04e3e',5);line(head[0],head[1],front[0],front[1],'#d7e1e5',5);line(head[0]+3,head[1],front[0],front[1],'#f5a72e',2.5);
// Rear shock and linkage.
line(-20,-8,-8,-24,'#d8e4e9',3);line(-8,-24,2,-11,'#f4a62b',4);line(-8,-24,2,-11,'#e8edf0',1.5);
line(29,-33,43,-43,'#172735',4);line(43,-43,50,-40,'#172735',4);
// Rider legs, body, arms, helmet.
line(-14,-29,-4,-50,'#263f55',8);line(-4,-50,12,-28,'#263f55',7);line(12,-28,22,-28,'#182b3a',5);line(-4,-50,-19,-24,'#263f55',7);line(-19,-24,-25,-3,'#172b38',6);
line(-5,-51,9,-72,'#08749b',11);line(9,-72,28,-54,'#08749b',9);line(28,-54,42,-43,'#263f55',6);line(9,-72,-2,-55,'#08749b',8);
c.fillStyle='#f0c293';c.beginPath();c.arc(7,-84,10,0,Math.PI*2);c.fill();c.fillStyle='#172c40';c.beginPath();c.arc(7,-88,11,Math.PI,Math.PI*2);c.fill();line(9,-83,17,-82,'#172c40',2);
// Rider jersey accent.
line(1,-68,15,-62,'#e8f2f4',2);c.restore();}
function render(){c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,vw,vh);drawBackground();drawTrees();drawTerrain();for(const p of particles){c.globalAlpha=clamp(p.life*2,0,1);c.fillStyle='#d8b18a';c.beginPath();c.arc(p.x,p.y,p.size,0,Math.PI*2);c.fill()}c.globalAlpha=1;drawBike();if(paused||dead){c.fillStyle='#ffffff12';c.fillRect(0,0,vw,vh)}}
function loop(t){const dt=Math.min(.032,(t-last)/1000||0);last=t;update(dt);render();requestAnimationFrame(loop)}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,180));resize();reset();last=performance.now();requestAnimationFrame(loop);
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
